# 매주 교육청(NEIS) 학원교습소정보를 받아 사이트(GitHub Pages)를 다시 만든다.
#
# 처음 한 번만 설정:
#   1) Settings → Pages → Build and deployment → Source: GitHub Actions
#   2) (권장) Settings → Secrets and variables → Actions → New repository secret
#      이름: NEIS_KEY / 값: 나이스 교육정보 개방 포털에서 발급받은 인증키
#      인증키가 있으면 Open API 로 매주 최신 자료를, 없으면 교육청이 매달 올리는 전국 파일을 쓴다.
#   3) Actions → "교육청 데이터 주간 업데이트" → Run workflow
#
# 받다가 실패하면 배포하지 않으므로 지난번 사이트(데이터)가 그대로 남는다.
name: 교육청 데이터 주간 업데이트

on:
  schedule:
    # 매주 월요일 03:00 (한국 시간) = 일요일 18:00 UTC
    - cron: '0 18 * * 0'
  workflow_dispatch:
  push:
    branches: [claude/ecstatic-shannon-aoogam]

permissions:
  contents: read
  pages: write
  id-token: write
  # 공개 저장소의 예약 실행은 60일 동안 활동이 없으면 꺼지므로 매주 다시 켜 둔다
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      pages: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 주차 계산
        id: week
        run: echo "week=$(TZ=Asia/Seoul date +%G-%V)" >> "$GITHUB_OUTPUT"

      # 체육시설·스포츠강좌 (국민체육진흥공단, 공공데이터포털 인증키 DATA_GO_KR_KEY)
      # 정기·수동 실행은 새로 받는다. 코드만 바뀐 push 는 가장 최근에 받아 둔 원자료를 다시 가공한다(없을 때만 받는다).
      # 받다가 실패하면 가장 최근에 받아 둔 원자료를 쓰고, 그것도 없으면 체육 자료 없이 배포한다.
      - name: 체육 원자료 불러오기
        id: sports-cache
        uses: actions/cache/restore@v4
        with:
          path: .sports-raw
          key: sports-raw-${{ steps.week.outputs.week }}-${{ github.run_id }}
          restore-keys: |
            sports-raw-${{ steps.week.outputs.week }}-
            sports-raw-

      - name: 체육 자료 받기
        id: sports
        if: github.event_name != 'push' || steps.sports-cache.outputs.cache-matched-key == ''
        continue-on-error: true
        timeout-minutes: 30
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: npm run sports:fetch

      - name: 받은 체육 원자료 보관
        if: steps.sports.outputs.fetched == 'true'
        uses: actions/cache/save@v4
        with:
          path: .sports-raw
          key: sports-raw-${{ steps.week.outputs.week }}-${{ github.run_id }}

      - name: 체육 원자료 올리기 (점검용, 3일 보관)
        if: steps.sports.outputs.fetched == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sports-raw
          path: .sports-raw
          include-hidden-files: true
          retention-days: 3

      # 교육청 원자료(.neis-raw)를 보관해 두고, 코드만 바뀐 push 는 이번 주(한국 시간)에 받은 원자료를 새 코드로 다시 가공한다
      - name: 이번 주 원자료 불러오기
        if: github.event_name == 'push'
        uses: actions/cache/restore@v4
        with:
          path: .neis-raw
          key: neis-raw-${{ steps.week.outputs.week }}-${{ github.run_id }}
          restore-keys: neis-raw-${{ steps.week.outputs.week }}-

      - name: 보관한 원자료로 가공
        if: github.event_name == 'push' && hashFiles('.neis-raw/meta.json') != ''
        run: npm run data:update -- --from-raw .neis-raw

      - name: 교육청 데이터 받기
        id: fetch
        if: github.event_name != 'push' || hashFiles('.neis-raw/meta.json') == ''
        env:
          NEIS_KEY: ${{ secrets.NEIS_KEY }}
        run: npm run data:update

      - name: 받은 원자료 보관
        if: steps.fetch.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: .neis-raw
          key: neis-raw-${{ steps.week.outputs.week }}-${{ github.run_id }}

      - run: npm test

      - run: npm run build

      # Pages 를 아직 켜지 않았으면 배포만 건너뛴다 (빌드·테스트는 그대로 확인)
      - name: Pages 설정 확인
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh api "repos/${{ github.repository }}/pages" --jq .build_type 2>/dev/null)" = "workflow" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::GitHub Pages 가 GitHub Actions 배포로 설정되어 있지 않아 배포를 건너뜁니다. Settings → Pages → Source: GitHub Actions"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 예약 실행 켜 두기
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update-data.yml/enable"

      - if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v5

      - if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.pages == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
